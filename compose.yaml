services:
    # standalone frontend
    frontend:
        build:
            context: .
            args:
                PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        environment:
            NODE_ENV: production
            PORT: ${PORT:-4173}
        ports:
            - ${PORT:-4173}:${PORT:-4173}
        profiles: [""]

    # frontend together with local mock-backend
    frontend-mock-local:
        build:
            context: .
            args:
                PUBLIC_API_BASE_URL: http://localhost:3001
        environment:
            NODE_ENV: production
            PORT: ${PORT:-4173}
        ports:
            - ${PORT:-4173}:${PORT:-4173}
        depends_on:
            - mock-backend
        profiles:
            - mock-local

    mock-backend:
        image: ghcr.io/se-uulm/snowballr-mock-backend:main
        environment:
            ENABLE_DUMMY_ADMIN: "true"
            EXAMPLE_DATA_FILE: "standardData.ts"
            GRPC_PORT: 3000
            GRPC_WEB_PORT: 3001
        ports:
            - "3000:3000"
            - "3001:3001"
        profiles:
            - mock-local

    # frontend with public mock-backend
    frontend-mock-public:
        build:
            context: .
            args:
                PUBLIC_API_BASE_URL: http://snowballr.informatik.uni-ulm.de:3001
        environment:
            NODE_ENV: production
            PORT: ${PORT:-4173}
        ports:
            - ${PORT:-4173}:${PORT:-4173}
        profiles:
            - mock-public
