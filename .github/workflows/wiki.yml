name: Lint and Publish Wiki

on:
    push:
        branches:
            - main
            - develop
    pull_request:
    workflow_dispatch:

env:
    node-version: ${{ vars.NODE_VERSION }}

jobs:
    lint-md:
        name: Linting Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Lint Markdown
              uses: SE-UUlm/snowballr-ci/src/lint-md@feat/1-feature-add-initial-workflows
              with:
                  node-version: ${{ env.node-version }}
                  source-branch: develop
                  ignore-links: "https://dl.acm.org/doi/*,https://stackoverflow.com/questions/1777854/how-can-i-specify-a-branch-tag-when-adding-a-git-submodule/1778247#1778247"
                  ignore-paths: "src/,tests/"

    publish-wiki:
        name: Publish Wiki
        if: ${{ github.ref_name == 'develop' && github.ref_type == 'branch' }}
        runs-on: ubuntu-latest
        needs: lint-md
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Publish Wiki
              uses: SE-UUlm/snowballr-ci/src/wiki-publish@feat/1-feature-add-initial-workflows
