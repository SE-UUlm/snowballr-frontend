name: Lint and Publish Wiki

on:
    push:
        branches:
            - main
            - develop
    pull_request:
    workflow_dispatch:

env:
    node_version: ${{ vars.NODE_VERSION }}

jobs:
    linting:
        name: Linting Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node_version }}

            - name: Install dependencies
              shell: bash
              run: npm ci

            - name: Lint Markdown files
              run: npm run lint-md

            - name: Check for Broken Links in README
              uses: becheran/mlc@v0.22.0
              with:
                  args: README.md

            - name: Check for Broken Links in README
              uses: becheran/mlc@v0.22.0
              with:
                  args: --ignore-links "https://dl.acm.org/doi/*,https://stackoverflow.com/questions/1777854/how-can-i-specify-a-branch-tag-when-adding-a-git-submodule/1778247#1778247" wiki/

    publish-wiki:
        name: Publish Wiki
        if: github.ref_name == 'develop' && github.ref_type == 'branch'
        runs-on: ubuntu-latest
        needs: linting
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Add auto-generated hint to wiki markdown files
              run: bash scripts/add_auto_gen_wiki_hint.sh

            - name: Publish the Wiki
              uses: Andrew-Chen-Wang/github-wiki-action@v4
              with:
                  path: "wiki/"
                  strategy: "init"
