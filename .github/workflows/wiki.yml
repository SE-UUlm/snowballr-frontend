name: Lint and Publish Wiki

on:
    push:
        branches:
            - main
            - develop
    pull_request:
    workflow_dispatch:

jobs:
    lint-md:
        name: Linting Markdown
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Lint Markdown
              uses: SE-UUlm/snowballr-ci/src/lint-md@v1.0.0
              with:
                  node-version: 22
                  source-branch: develop
                  ignore-links: "https://dl.acm.org/doi/*"
                  ignore-paths: "src/,tests/"

    publish-wiki:
        name: Publish Wiki
        if: github.ref_name == 'develop' && github.ref_type == 'branch'
        runs-on: ubuntu-latest
        needs: lint-md
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Publish Wiki
              uses: SE-UUlm/snowballr-ci/src/wiki-publish@v1.0.0
