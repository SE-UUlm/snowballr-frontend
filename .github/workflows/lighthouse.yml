name: Lighthouse

on:
    pull_request:
        types:
            - review_requested

env:
    node_version: ${{ vars.NODE_VERSION }}

jobs:
    lighthouse:
        name: Lighthouse Auditing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: "recursive"

            - name: Set up Docker Compose
              uses: docker/setup-compose-action@v1

            # We use the mock-local compose profile to run the frontend together with a dummy mock-backend
            - name: Run frontend with dummy mock-backend
              run: |
                  echo "PORT=8080" > .env
                  docker compose --profile mock-local up -d --wait

            - name: Generate URLs
              id: urls
              uses: actions/github-script@v7
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const globber = await glob.create('**/src/routes/**/+page.svelte');
                      const files = await globber.glob();
                      const urls = files
                          .map(x => x.match(/routes\/([\(a-zA-Z\/\[\]\)]*?)\/?\+page\.svelte/)[1])
                          .map(x => x.replace('[paperId]', '1').replace('[projectId]', '1').replace(/\([a-z\-]+\)\//g, ''))
                          .map(x => `http://localhost:8080/${x}`)
                          .join('\n');
                      console.log('generated URLs:', urls);
                      core.setOutput('urls', urls);

            - name: Audit URLs using Lighthouse
              uses: treosh/lighthouse-ci-action@v12
              with:
                  urls: ${{ steps.urls.outputs.urls }}
                  uploadArtifacts: true
                  configPath: .github/lighthouserc.json
