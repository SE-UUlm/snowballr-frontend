name: Code Quality Checks

on:
    push:
        branches:
            - main
            - develop
    pull_request:
    merge_group:
    workflow_dispatch:

env:
    node_version: ${{ vars.NODE_VERSION }}
    PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

jobs:
    linting:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  submodules: "recursive"

            - name: Setup
              uses: ./.github/workflows/setup/
              with:
                  node_version: ${{ env.node_version }}

            - name: Run License Check
              run: npm run license-check

            - name: Linting
              run: npm run lint

    unit-test:
        name: Unit Testing with Vitest
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  submodules: "recursive"

            - name: Setup
              uses: ./.github/workflows/setup/
              with:
                  node_version: ${{ env.node_version }}

            - name: Run unit tests
              run: npm run test:unit

            - name: Archive coverage report
              uses: actions/upload-artifact@v5
              if: ${{ !cancelled() }}
              with:
                  name: unit-code-coverage-report
                  path: coverage/
                  retention-days: 1
                  if-no-files-found: error

    integration-test:
        name: Integration Testing with Vitest
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  submodules: "recursive"

            - name: Setup
              uses: ./.github/workflows/setup/
              with:
                  node_version: ${{ env.node_version }}

            - name: Run integration tests
              run: npm run test:integration

            - name: Archive coverage report
              uses: actions/upload-artifact@v5
              if: ${{ !cancelled() }}
              with:
                  name: integration-code-coverage-report
                  path: coverage/
                  retention-days: 1
                  if-no-files-found: error

    coverage-report:
        name: Code Coverage Report
        runs-on: ubuntu-latest
        needs: [unit-test, integration-test]
        permissions:
            pull-requests: write
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  submodules: "recursive"

            - name: Setup
              uses: ./.github/workflows/setup/
              with:
                  node_version: ${{ env.node_version }}

            - name: Download unit test coverage report
              uses: actions/download-artifact@v6
              with:
                  name: unit-code-coverage-report
                  path: coverage/unit

            - name: Download integration test coverage report
              uses: actions/download-artifact@v6
              with:
                  name: integration-code-coverage-report
                  path: coverage/integration

            # Now there are two coverage reports in the coverage folder
            # coverage
            # ├── integration
            # │   └── lcov.info
            # └── unit
            #     └── lcov.info

            - name: Install LCOV
              run: sudo apt install lcov

            - name: Combine coverage reports
              run: lcov -a coverage/unit/lcov.info -a coverage/integration/lcov.info --output-file final-lcov.info

            - name: Report code coverage
              uses: zgosalvez/github-actions-report-lcov@v5
              with:
                  coverage-files: final-lcov.info
                  artifact-name: code-coverage-report
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  update-comment: true

            # We have to trigger this job on "pull_request" so that the coverage is commented in the PR,
            # but Teamscale requires a revision. Therefore, we retrieve the latest commit and set the revision manually.
            - name: Retrieve latest commit of PR
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  # Fetch commits of PR
                  response=$(curl --request GET \
                      --url 'https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits' \
                      --header 'Accept: application/vnd.github.v3+json' \
                      --header 'Content-Type: application/json')
                  # Store response in JSON file and retrieve SHA of latest commit
                  echo $response > response.json
                  length=$(jq 'length' response.json)
                  index=$(($length - 1))
                  latest_commit=$(jq --argjson index $index '.[$index]' response.json)
                  latest_commit_sha=$(echo "$latest_commit" | jq -r '.sha')
                  echo "Latest Commit SHA: $latest_commit_sha"
                  echo "LATEST_COMMIT_SHA=$latest_commit_sha" >> $GITHUB_ENV

            - name: Teamscale Upload
              if: github.actor != 'dependabot[bot]'
              uses: cqse/teamscale-upload-action@v2.9.6
              with:
                  server: "https://exia.informatik.uni-ulm.de/teamscale"
                  project: "d8724f02-e6d7-4d13-8f07-bdf631ceaf2e"
                  user: "slartibartfass2"
                  accesskey: ${{ secrets.TEAMSCALE_ACCESS_KEY }}
                  partition: "Github Action > ${{ github.ref_name }} ${{ github.run_id }}"
                  format: LCOV
                  message: "Code coverage from GitHub Actions"
                  files: ${{ github.workspace }}/final-lcov.info
                  # When the event is a PR, use the previously defined env variable; otherwise the `github.sha` is fine.
                  revision: ${{ github.event_name == 'pull_request' && env.LATEST_COMMIT_SHA || github.sha }}

    check:
        name: Svelte Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  submodules: "recursive"

            - name: Setup
              uses: ./.github/workflows/setup/
              with:
                  node_version: ${{ env.node_version }}

            - name: Run all checks
              run: npm run check
