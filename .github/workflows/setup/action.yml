name: Setup
description: Setup Frontend CI/CD pipeline
inputs:
    node_version:
        description: "Node.js version"
        required: true
runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
              node-version: ${{ inputs.node_version }}

        - name: Install dependencies
          shell: bash
          run: npm ci

        - name: Generate gRPC web client code
          shell: bash
          run: npm run compile:proto

        - name: Svelte-Kit sync
          shell: bash
          run: npx svelte-kit sync
